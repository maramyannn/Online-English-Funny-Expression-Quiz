<title>Funny English Expressions Quiz</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito+Sans:wght@500;700;800&family=Noto+Sans+Armenian:wght@500;700;800&display=swap">
<style>
/* Layout: one centred column; start screen > question card with photo > feedback strip > result. Playful single-look palette taken from the printed dictionary. */
:root{
  --ink:#2C3E50; --paper:#FFFDF4; --sky:#D6EAF8; --blue:#1F618D; --sun:#F4D03F;
  --red:#E74C3C; --green:#1E8449; --green-bg:#D5F5E3; --red-bg:#FADBD8; --purple:#7D3C98; --orange:#E67E22;
  --display:"Fredoka","Noto Sans Armenian",system-ui,sans-serif;
  --body:"Nunito Sans","Noto Sans Armenian",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--sky);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
  padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-height:100vh;
  background-image:radial-gradient(#fff9 2px,transparent 2.5px);background-size:26px 26px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,.display{font-family:var(--display);text-wrap:balance}
.card{background:var(--paper);border:4px solid var(--ink);border-radius:26px;box-shadow:6px 7px 0 var(--ink);padding:20px;min-width:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:4px solid var(--purple);outline-offset:3px}
.btn{font-family:var(--display);font-weight:700;font-size:1.15rem;background:var(--sun);border:4px solid var(--ink);border-radius:999px;padding:10px 26px;box-shadow:4px 5px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translate(-1px,-1px)}.btn:active{transform:translate(3px,4px);box-shadow:1px 1px 0 var(--ink)}
.btn.alt{background:#fff}
/* start */
.brand{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.ribbon{background:var(--sun);border:3px solid var(--ink);border-radius:10px;padding:2px 12px;font-family:var(--display);font-weight:700;letter-spacing:.14em;font-size:.8rem;transform:rotate(-1.5deg)}
h1{margin:0;font-size:clamp(2.4rem,9vw,3.6rem);line-height:.95;font-weight:700;letter-spacing:-.01em}
h1 .a{color:var(--red)}h1 .b{color:var(--blue)}h1 .c{color:var(--purple)}
.sub{margin:0;font-weight:700}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:6px}
.mode{text-align:left;background:#fff;border:4px solid var(--ink);border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;box-shadow:4px 5px 0 var(--ink)}
.mode:hover{transform:translate(-1px,-1px)}
.mode strong{font-family:var(--display);font-size:1.2rem}
.mode span{font-size:.92rem}
.mode.m1{border-color:var(--blue)}.mode.m2{border-color:var(--purple)}
.best{font-size:.9rem;font-weight:700;min-height:1.3em}
/* quiz */
.top{display:flex;align-items:center;gap:12px}
.pill{font-family:var(--display);font-weight:700;background:#fff;border:3px solid var(--ink);border-radius:999px;padding:2px 14px;white-space:nowrap}
.bar{flex:1;height:18px;border:3px solid var(--ink);border-radius:999px;background:#fff;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);width:0;transition:width .3s}
.pic{position:relative;border:4px solid var(--ink);border-radius:18px;overflow:hidden;background:#fff;aspect-ratio:16/10;max-height:340px;width:100%}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.qlabel{margin:14px 0 4px;font-weight:800;font-size:.85rem;letter-spacing:.08em;text-transform:uppercase;color:var(--blue)}
.qtext{font-family:var(--display);font-weight:700;font-size:clamp(1.5rem,5.5vw,2.1rem);line-height:1.1;margin:0 0 14px;color:var(--ink)}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:#fff;border:4px solid var(--ink);border-radius:16px;padding:10px 14px;font-weight:700;font-size:1.02rem;min-height:56px}
.opt:hover:not(:disabled){background:var(--sun)}
.opt .k{flex:none;width:30px;height:30px;border-radius:50%;border:3px solid var(--ink);background:var(--sun);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:.95rem}
.opt:disabled{cursor:default}
.opt.right{background:var(--green-bg);border-color:var(--green)}
.opt.right .k{background:var(--green);color:#fff;border-color:var(--green)}
.opt.wrong{background:var(--red-bg);border-color:var(--red)}
.opt.wrong .k{background:var(--red);color:#fff;border-color:var(--red)}
.opt .mark{margin-left:auto;font-family:var(--display);font-size:.85rem;white-space:nowrap}
.fb{margin-top:14px;border:4px solid var(--ink);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.fb.ok{background:var(--green-bg);border-color:var(--green)}.fb.no{background:var(--red-bg);border-color:var(--red)}
.fb h2{margin:0;font-size:1.3rem}
.fb.ok h2{color:var(--green)}.fb.no h2{color:#B03A2E}
.row{font-size:.95rem}.row b{font-weight:800}
.l1 b{color:#B03A2E}.l2 b{color:var(--green)}.l3 b{color:var(--purple)}
.next{align-self:flex-end;margin-top:6px}
/* result */
.score{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.big{font-family:var(--display);font-weight:700;font-size:4rem;line-height:1;background:var(--sun);border:4px solid var(--ink);border-radius:22px;padding:6px 20px;box-shadow:5px 6px 0 var(--ink);transform:rotate(-2deg)}
.big small{font-size:1.6rem}
.rank{font-family:var(--display);font-size:1.7rem;font-weight:700;line-height:1.1}
.miss{display:flex;flex-direction:column;gap:8px;margin:16px 0 0;padding:0;list-style:none}
.miss li{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:8px 12px;font-size:.95rem}
.miss strong{font-family:var(--display);font-size:1.05rem}
.acts{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}
.foot{text-align:center;font-size:.85rem;font-weight:700}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const CONFLICT=[[5,6],[9,15]];
const ROUND=10;
const $=s=>document.querySelector(s);
const app=$('#app');
let mode=1,qs=[],idx=0,score=0,missed=[],locked=false;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clash=(a,b)=>CONFLICT.some(p=>p.includes(a.n)&&p.includes(b.n));
function best(m){try{return +localStorage.getItem('fee-best-'+m)||0}catch(e){return 0}}
function saveBest(m,v){try{if(v>best(m))localStorage.setItem('fee-best-'+m,v)}catch(e){}}
function start(){
  app.innerHTML=`
  <div class="card">
    <div class="brand"><span class="ribbon">ONLINE QUIZ</span>
    <h1><span class="a">Funny</span> <span class="b">English</span> <span class="c">Expressions</span></h1>
    <p class="sub">Power of Words • The Art of Translation</p></div>
    <p>Դարձվածքները բառացի չեն թարգմանվում։ Ստուգի՛ր, թե որքան լավ գիտես դրանց իրական իմաստը։ Յուրաքանչյուր խաղում ${ROUND} հարց է։</p>
    <div class="modes">
      <button class="mode m1" data-m="1"><strong>1 · Ի՞նչ է նշանակում</strong><span>Տեսնում ես նկարն ու անգլերեն դարձվածքը, ընտրում ես հայերեն համարժեքը։</span><span class="best">Լավագույնը՝ ${best(1)} / ${ROUND}</span></button>
      <button class="mode m2" data-m="2"><strong>2 · Գուշակի՛ր նկարից</strong><span>Տեսնում ես նկարը, ընտրում ես ճիշտ անգլերեն դարձվածքը։</span><span class="best">Լավագույնը՝ ${best(2)} / ${ROUND}</span></button>
    </div>
  </div>`;
  app.querySelectorAll('.mode').forEach(b=>b.onclick=()=>begin(+b.dataset.m));
}
function begin(m){
  mode=m;qs=shuffle(DATA).slice(0,ROUND);idx=0;score=0;missed=[];ask();
}
function options(item){
  const pool=shuffle(DATA.filter(x=>x.n!==item.n&&!clash(x,item)));
  const key=mode===1?'hy':'en';
  const seen=new Set([item[key]]);const wrong=[];
  for(const x of pool){if(!seen.has(x[key])){seen.add(x[key]);wrong.push(x);if(wrong.length===3)break}}
  return shuffle([item,...wrong]);
}
function ask(){
  locked=false;
  const it=qs[idx],opts=options(it),key=mode===1?'hy':'en';
  app.innerHTML=`
  <div class="top"><span class="pill">${idx+1} / ${ROUND}</span><div class="bar"><i style="width:${idx/ROUND*100}%"></i></div><span class="pill">★ ${score}</span></div>
  <div class="card">
    <div class="pic"><img src="${it.img}" alt="Նկար՝ ${esc(it.en)}"></div>
    <div class="qlabel">${mode===1?'Ի՞նչ է նշանակում':'Ո՞ր դարձվածքն է սա'}</div>
    <h2 class="qtext">${mode===1?esc(it.en):'Ընտրի՛ր ճիշտ դարձվածքը'}</h2>
    <div class="opts">${opts.map((o,i)=>`<button class="opt" data-n="${o.n}"><span class="k">${'ABCD'[i]}</span><span>${esc(o[key])}</span></button>`).join('')}</div>
    <div id="fb" aria-live="polite"></div>
  </div>`;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.n));
}
function pick(n){
  if(locked)return;locked=true;
  const it=qs[idx],ok=n===it.n;
  if(ok)score++;else missed.push(it);
  app.querySelectorAll('.opt').forEach(b=>{
    b.disabled=true;const bn=+b.dataset.n;
    if(bn===it.n){b.classList.add('right');b.insertAdjacentHTML('beforeend','<span class="mark">✓ Ճիշտ</span>')}
    else if(bn===n){b.classList.add('wrong');b.insertAdjacentHTML('beforeend','<span class="mark">✗ Սխալ</span>')}
  });
  const last=idx===ROUND-1;
  $('#fb').innerHTML=`<div class="fb ${ok?'ok':'no'}"><h2>${ok?'Ճիշտ է։':'Այս անգամ՝ ոչ։'}</h2>
    <div class="row"><b>${esc(it.en)}</b></div>
    <div class="row l1"><b>Բառացի՝</b> ${esc(it.lit)}</div>
    <div class="row l2"><b>Իրական իմաստ՝</b> ${esc(it.real)}</div>
    <div class="row l3"><b>Հայ. բնական՝</b> ${esc(it.hy)}</div>
    <button class="btn next" id="nx">${last?'Տեսնել արդյունքը':'Հաջորդը →'}</button></div>`;
  const nx=$('#nx');nx.onclick=()=>{idx++;idx<ROUND?ask():finish()};nx.focus({preventScroll:true});
  nx.scrollIntoView({block:'nearest',behavior:'smooth'});
}
function finish(){
  saveBest(mode,score);
  const r=score>=9?['Idiom Master 🏆','Հիանալի՛ է։ Դու գրեթե չես սխալվում։']:score>=7?['Word Wizard','Շատ լավ արդյունք։']:score>=5?['Good Start','Լավ սկիզբ է, փորձի՛ր նորից։']:['Try Again!','Նորից փորձիր՝ դարձվածքները շուտ են հիշվում։'];
  app.innerHTML=`
  <div class="card">
    <div class="score"><div class="big">${score}<small> / ${ROUND}</small></div><div><div class="rank">${r[0]}</div><div>${r[1]}</div></div></div>
    ${missed.length?`<h2 style="margin:18px 0 0;font-size:1.3rem">Կրկնենք սխալվածները</h2><ul class="miss">${missed.map(m=>`<li><strong>${esc(m.en)}</strong><br>${esc(m.lit)} → <b>${esc(m.hy)}</b></li>`).join('')}</ul>`:'<p style="margin-top:16px"><b>Ոչ մի սխալ։ Կատարյալ խաղ է։</b></p>'}
    <div class="acts"><button class="btn" id="again">Նորից խաղալ</button><button class="btn alt" id="menu">Ընտրել ռեժիմը</button></div>
  </div>`;
  $('#again').onclick=()=>begin(mode);$('#menu').onclick=start;
}
document.addEventListener('keydown',e=>{
  const k=e.key;
  if(['1','2','3','4'].includes(k)){const bs=app.querySelectorAll('.opt');if(bs[+k-1]&&!locked)bs[+k-1].click()}
  else if(k==='Enter'&&locked){const nx=$('#nx');if(nx&&document.activeElement!==nx)nx.click()}
});
start();
</script>
